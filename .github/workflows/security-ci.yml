name: Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [security-hardening]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: panel
        run: corepack pnpm install --frozen-lockfile

      - name: Server tests
        working-directory: panel
        run: corepack pnpm run test:server

      - name: Validate generated sing-box config
        working-directory: panel
        run: corepack pnpm run check:config

      - name: Build panel
        working-directory: panel
        run: corepack pnpm run build

      - name: Shell syntax checks
        run: |
          sh -n openwrt/initd/openbox-panel
          sh -n scripts/install.sh
          sh -n scripts/update.sh
